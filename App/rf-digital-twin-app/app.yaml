command: [
  "shiny",
  "run",
  "--reload",
  "--host", "0.0.0.0",
  "--port", "8000",
  "app.py:app"
]

# Resource bindings (configure in the Databricks Apps UI when creating the app):
#
#   1. Lakebase database  → instance: rf-digital-twin-pg, database: rf_digital_twin
#      This automatically populates the following env vars in the container:
#        PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD, PGSSLMODE, PGAPPNAME
#      No manual env mapping is needed for these.
#
#   2. (Optional) Secret  → key: sionna-job-id  (only if you wire up
#      jobs/sionna_compute_job.py so the app can submit live re-renders).
#      Uncomment the env entry below after creating that secret.
#
# env:
#   - name: SIONNA_JOB_ID
#     valueFrom: "sionna-job-id"
