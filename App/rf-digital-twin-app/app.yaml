command: [
  "shiny",
  "run",
  "--host", "0.0.0.0",
  "--port", "8000",
  "app.py:app"
]

env:
  # Lakebase instance the app mints OAuth tokens for at runtime.
  - name: "LAKEBASE_INSTANCE"
    value: "rf-digital-twin-pg"

  # Databricks Job that renders custom configs (cache misses) on a GPU cluster.
  - name: "SIONNA_JOB_ID"
    value: "417222810044410"

  # Databricks Job that runs the NVlabs sionna-large-radio-maps pipeline for
  # the "Large-scale map" tab on a GPU cluster. When UNSET, that tab computes a
  # GPU-free synthetic demo inline instead. Created from
  # jobs/large_scale_compute_job.py — enables real Sionna RT large-scale ray
  # tracing on a cache miss.
  - name: "LARGE_SCALE_JOB_ID"
    value: "579716766302610"

  # Workspace host — used to build clickable links into the Databricks Jobs UI
  # for in-progress runs.
  - name: "DATABRICKS_WORKSPACE_URL"
    value: "https://fevm-cmegdemos.cloud.databricks.com"

# Resource bindings (configure in the Databricks Apps UI when creating the app):
#   1. Lakebase database  → instance: rf-digital-twin-pg, database: rf_digital_twin
#      This populates PGHOST / PGPORT / PGDATABASE / PGUSER (PGPASSWORD is NOT
#      injected — the app mints a fresh OAuth token via the Databricks SDK).
#   2. (Optional) Secret  → key: sionna-job-id  for live re-renders.
