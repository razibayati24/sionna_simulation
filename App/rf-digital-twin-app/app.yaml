command: [
  "shiny",
  "run",
  "--reload",
  "--host", "0.0.0.0",
  "--port", "8000",
  "app.py:app"
]

env:
  # Lakebase Postgres — values come from the Databricks Apps resource binding.
  - name: "PGHOST"
    valueFrom: "lakebase-host"
  - name: "PGPORT"
    valueFrom: "lakebase-port"
  - name: "PGDATABASE"
    valueFrom: "lakebase-database"
  - name: "PGUSER"
    valueFrom: "lakebase-user"
  - name: "PGPASSWORD"
    valueFrom: "lakebase-password"
  - name: "PGSSLMODE"
    value: "require"

  # Optional — set to a Databricks Job ID that runs jobs/sionna_compute_job.py
  # to enable live re-renders for custom configurations. Leave unset to allow
  # only cached Config 1 / Config 2.
  - name: "SIONNA_JOB_ID"
    valueFrom: "sionna-job-id"
