command: [
  "shiny",
  "run",
  "--reload",
  "--host", "0.0.0.0",
  "--port", "8000",
  "app.py:app"
]

env:
  # SQL warehouse the app queries for cached renders. Bound at app creation
  # time via the `warehouse` resource; the binding auto-populates
  # DATABRICKS_WAREHOUSE_ID.
  - name: "DATABRICKS_WAREHOUSE_ID"
    valueFrom: "warehouse"

  # Lakehouse target tables — change here if you move the data.
  - name: "LAKEHOUSE_CATALOG"
    value: "cmegdemos_catalog"
  - name: "LAKEHOUSE_SCHEMA"
    value: "sionna_rf_data"

  # Databricks Job that renders custom configs to Lakehouse on cache miss.
  # Created by the setup notebook; ID copied here once it exists.
  - name: "SIONNA_JOB_ID"
    value: "826620913190313"

  - name: "DATABRICKS_WORKSPACE_URL"
    value: "https://fevm-cmegdemos.cloud.databricks.com"
