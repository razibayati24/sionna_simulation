command: [
  "shiny",
  "run",
  "--reload",
  "--host", "0.0.0.0",
  "--port", "8000",
  "app.py:app"
]

env:
  # Lakebase instance the app mints OAuth tokens for at runtime (shared with the etoile demo).
  - name: "LAKEBASE_INSTANCE"
    value: "rf-digital-twin-pg"

  # GPU job that renders a neighborhood on demand (cache miss). Set after creating the job
  # from jobs/seattle_render_job.py.
  - name: "SEATTLE_RENDER_JOB_ID"
    value: ""

  # Workspace host — used to build clickable links into the Jobs UI for in-progress runs.
  - name: "DATABRICKS_WORKSPACE_URL"
    value: "https://fevm-cmegdemos.cloud.databricks.com"

# Resource bindings (configure in the Databricks Apps UI when creating the app):
#   1. Lakebase database  → instance: rf-digital-twin-pg, database: rf_digital_twin
#      Populates PGHOST / PGPORT / PGDATABASE / PGUSER (PGPASSWORD is minted at runtime
#      via the Databricks SDK OAuth token).
#   2. Grant the app service principal CAN MANAGE RUN on the render job so the neighborhood
#      dropdown can trigger on-demand renders.
